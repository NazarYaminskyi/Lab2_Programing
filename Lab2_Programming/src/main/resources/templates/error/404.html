<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f6f6;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .error-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }

        .status {
            font-size: 60px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }

        .message {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .hint {
            font-size: 14px;
            color: #777;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background: #2980b9;
        }
    </style>
</head>

<body>

<div class="error-container">

    <div class="status" th:text="${status}">404</div>

    <div class="message" th:text="${message}">
        Something went wrong
    </div>

    <div class="hint">
        The resource you are looking for might not exist or was removed.
    </div>

    <a href="/visitors">Go back to Visitors</a>

</div>

</body>
</html>
